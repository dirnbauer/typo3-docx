<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="ui.new.heading" domain="docx_editor.pagesync" arguments="{0: parentTitle}" /></h1>
    <p class="page-sync__hint"><f:translate key="ui.new.intro" domain="docx_editor.pagesync" /></p>

    <form
        class="page-sync-new"
        id="docx-page-sync-new"
        data-parent="{parentUid}"
        data-max-upload="{maxUploadMegabytes}"
        novalidate
    >
        <div class="form-group">
            <label class="form-label" for="docx-page-sync-file"><f:translate key="ui.new.file" domain="docx_editor.pagesync" /></label>
            <input
                class="form-control"
                type="file"
                id="docx-page-sync-file"
                name="file"
                required
                accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                aria-describedby="docx-page-sync-file-help"
            >
            <div class="form-text" id="docx-page-sync-file-help"><f:translate key="ui.new.fileHelp" domain="docx_editor.pagesync" arguments="{0: maxUploadMegabytes}" /></div>
        </div>

        <fieldset class="form-group">
            <legend class="form-label"><f:translate key="ui.new.split" domain="docx_editor.pagesync" /></legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="split" id="docx-page-sync-split-none" value="none" checked>
                <label class="form-check-label" for="docx-page-sync-split-none"><f:translate key="ui.new.split.none" domain="docx_editor.pagesync" /></label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="split" id="docx-page-sync-split-h1" value="h1">
                <label class="form-check-label" for="docx-page-sync-split-h1"><f:translate key="ui.new.split.h1" domain="docx_editor.pagesync" /></label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="split" id="docx-page-sync-split-pagebreak" value="pagebreak">
                <label class="form-check-label" for="docx-page-sync-split-pagebreak"><f:translate key="ui.new.split.pagebreak" domain="docx_editor.pagesync" /></label>
            </div>
        </fieldset>

        <f:if condition="{newPagesHidden}">
            <p class="form-text"><f:translate key="ui.new.hidden" domain="docx_editor.pagesync" /></p>
        </f:if>

        <button type="submit" class="btn btn-primary">
            <f:translate key="ui.new.submit" domain="docx_editor.pagesync" />
        </button>
    </form>

    <div class="page-sync-new__result" data-page-sync-result aria-live="polite"></div>
</f:section>

</html>
