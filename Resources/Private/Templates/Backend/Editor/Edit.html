<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <div class="docx-editor-module__header">
        <h1><f:translate key="editor.heading" domain="docx_editor.messages" arguments="{0: fileName}" /></h1>
        <span class="badge badge-default" role="status" aria-live="polite" data-docx-presence hidden>
            <typo3-backend-status-indicator state="success" live></typo3-backend-status-indicator>
            <span data-docx-presence-label></span>
        </span>
    </div>

    <f:if condition="{bundleBuilt}">
        <f:then>
            <div
                class="docx-editor-module"
                id="docx-editor-app"
                data-can-write="{canWrite}"
                data-element-browser-url="{elementBrowserUrl}"
                data-default-folder-identifier="{defaultFolderIdentifier}"
                data-editor-url="{editorUrl}"
                data-return-url="{returnUrl}"
                data-file-path="{filePath}"
            >
                <div class="callout callout-warning" role="alert" data-docx-conflict hidden>
                    <div class="callout-icon">
                        <span class="icon-emphasized"><core:icon identifier="actions-exclamation" size="small" /></span>
                    </div>
                    <div class="callout-content">
                        <div class="callout-title"><f:translate key="editor.conflict.title" domain="docx_editor.messages" /></div>
                        <div class="callout-body">
                            <p><f:translate key="editor.conflict.text" domain="docx_editor.messages" /></p>
                            <button type="button" class="btn btn-default" data-docx-reload>
                                <core:icon identifier="actions-refresh" size="small" />
                                <f:translate key="editor.reload" domain="docx_editor.messages" />
                            </button>
                        </div>
                    </div>
                </div>
                <typo3-docx-editor
                    class="docx-editor-module__surface"
                    file-identifier="{fileIdentifier}"
                    file-name="{fileName}"
                    revision="{revision}"
                    can-write="{canWrite}"
                    editor-locale="{editorLocale}"
                ></typo3-docx-editor>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox title="{f:translate(key: 'editor.buildMissing.title', domain: 'docx_editor.messages')}" state="2">
                <f:translate key="editor.buildMissing" domain="docx_editor.messages" />
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

</html>
