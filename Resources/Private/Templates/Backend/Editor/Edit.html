<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
<f:if condition="{bundleBuilt}">
    <f:then>
        <div class="docx-editor-module"
             id="docx-editor-app"
             data-can-write="{canWrite}"
             data-element-browser-url="{elementBrowserUrl}"
             data-default-folder-identifier="{defaultFolderIdentifier}"
             data-editor-url="{editorUrl}"
             data-labels="{labelsJson}">
            <div class="docx-editor-remote-banner d-none" data-docx-remote-banner>
                <span><f:translate key="editor.remoteUpdate" extensionName="docx_editor" /></span>
                <button type="button" class="btn btn-sm btn-warning" data-docx-remote-reload>
                    <f:translate key="editor.reload" extensionName="docx_editor" />
                </button>
            </div>
            <div class="docx-editor-module__meta">
                <span class="docx-editor-module__presence" data-docx-presence></span>
            </div>
            <typo3-docx-editor
                class="docx-editor-module__surface"
                file-identifier="{fileIdentifier}"
                file-name="{fileName}"
                revision="{revision}"
                can-write="{canWrite}"
                editor-locale="{editorLocale}"></typo3-docx-editor>
        </div>
    </f:then>
    <f:else>
        <div class="callout callout-danger">
            <div class="callout-body">
                <f:translate key="editor.buildMissing" extensionName="docx_editor" />
            </div>
        </div>
    </f:else>
</f:if>
</f:section>

</html>
